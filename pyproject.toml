[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "news-mcp-telegram-agent"
version = "1.0.0"
description = "Multi-Source News MCP Server with AI Agent Newsletter Automation on Telegram"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "python-telegram-bot>=21.0",
    "apscheduler>=3.10.0",
    "feedparser>=6.0.10",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "google-genai>=2.0.0",
    "openai>=1.40.0",
]

[project.scripts]
news-mcp-server = "mcp_server.server:run_stdio"
news-telegram-bot = "run_bot:main"
